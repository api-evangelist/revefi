aid: revefi
name: Revefi
description: >-
  Revefi is an AI-powered data operations platform that delivers FinOps,
  observability, and optimization for modern data warehouses and AI/LLM
  workloads. Its zero-touch "data copilot" (Raden) autonomously monitors data
  quality, spend, performance, and usage across Snowflake, Databricks, BigQuery,
  and Redshift, extracting only metadata, query logs, and aggregated statistics
  (never PII). Revefi exposes a Public API for programmatically managing custom
  data quality monitors and a hosted Model Context Protocol (MCP) server so AI
  assistants can query metadata and operate on warehouse data. The company is
  SOC 2 Type II certified and HIPAA compliant, and is backed by Mayfield.
